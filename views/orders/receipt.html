<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt</title>
  <link rel="icon" href="/assets/images/favicon-32x32.png" type="image/png">
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Noto Sans", system-ui, sans-serif;
      background: #f4f5f7;
      color: #111;
    }
    .receipt-sheet {
      max-width: 420px;
      margin: 1.5rem auto;
      background: #fff;
      padding: 1.5rem 1.35rem;
      border: 1px solid #e5e7eb;
    }
    .receipt-shop {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .receipt-meta {
      font-size: 0.82rem;
      color: #555;
    }
    .receipt-table {
      width: 100%;
      font-size: 0.88rem;
    }
    .receipt-table th {
      font-weight: 600;
      border-bottom: 1px dashed #ccc;
      padding: 0.35rem 0;
    }
    .receipt-table td {
      padding: 0.4rem 0;
      vertical-align: top;
      border-bottom: 1px dotted #eee;
    }
    .receipt-total {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .receipt-actions { max-width: 420px; margin: 0 auto 2rem; }
    .receipt-logo {
      display: block;
      max-width: 120px;
      max-height: 72px;
      object-fit: contain;
      margin: 0 auto 0.5rem;
    }
    .receipt-qr {
      display: block;
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin: 0.85rem auto 0;
    }
    .receipt-phone {
      text-align: center;
      color: #000;
      font-size: 0.9rem;
      margin: 0.45rem 0 0;
    }
    @media print {
      body { background: #fff; color: #000; }
      .no-print { display: none !important; }
      .receipt-sheet {
        max-width: none;
        margin: 0;
        border: none;
        padding: 0;
      }
      @page { margin: 10mm; }
      .receipt-qr {
        width: 140px;
        height: 140px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .receipt-phone { color: #000; }
    }
  </style>
</head>
<body>
  <div class="receipt-actions no-print px-3 pt-3 d-flex gap-2 justify-content-center">
    <button type="button" class="btn btn-dark btn-sm" id="printBtn">Print Receipt</button>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="closeBtn">Close</button>
  </div>
  <div class="receipt-sheet" id="sheet">
    <p class="text-center text-secondary small mb-0" id="loadMsg">Loading receipt…</p>
  </div>
  <script src="/static/js/app.js"></script>
  <script>
  (function () {
    var orderId = {{ order_id | int }};
    var shop = {{ shop | tojson }};

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
      });
    }

    function fmtBh(iso) {
      try {
        return new Date(iso).toLocaleString('en-GB', {
          timeZone: 'Asia/Bahrain',
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        });
      } catch (e) {
        return esc(iso);
      }
    }

    function payLabel(m) {
      var map = { cash: 'Cash', card: 'Card', transfer: 'Transfer' };
      return map[m] || (m || '');
    }

    function modsLine(mods) {
      if (!mods || !Array.isArray(mods) || !mods.length) return '';
      return mods.map(function (m) {
        return esc(m.group_name || '') + ': ' + esc(m.option_name || '');
      }).join(', ');
    }

    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
    document.getElementById('closeBtn').addEventListener('click', function () { window.close(); });

    (async function () {
      var token = PodCafe.getToken();
      if (!token) {
        window.location.replace('/login');
        return;
      }
      var res = await PodCafe.apiFetch('/api/v1/orders/' + encodeURIComponent(orderId));
      var sheet = document.getElementById('sheet');
      if (!res.ok) {
        sheet.innerHTML = '<p class="text-danger small mb-0">Could not load this receipt. You may not have access.</p>';
        return;
      }
      var o = await res.json();
      var cafeName = (shop && shop.cafe_name) ? String(shop.cafe_name) : 'My Cafe';
      document.title = 'Receipt #' + o.id;
      var rows = (o.items || []).map(function (it) {
        var line = Number(it.unit_price) * Number(it.quantity);
        var extra = modsLine(it.modifiers_snapshot);
        return '<tr>' +
          '<td>' + esc(it.product_name || ('#' + it.product_id)) +
            (extra ? '<div class="receipt-meta">' + extra + '</div>' : '') +
            (it.notes ? '<div class="receipt-meta">' + esc(it.notes) + '</div>' : '') +
          '</td>' +
          '<td class="text-center">' + it.quantity + '</td>' +
          '<td class="text-end">' + PodCafe.currency(line) + '</td>' +
        '</tr>';
      }).join('');
      var logoHtml = (shop && shop.logo_url)
        ? '<img class="receipt-logo" src="' + esc(shop.logo_url) + '" alt="">'
        : '';
      var qrHtml = (shop && shop.payment_qr_url)
        ? '<img class="receipt-qr" src="' + esc(shop.payment_qr_url) + '" alt="Payment QR">'
        : '';
      var phoneHtml = (shop && shop.phone_number)
        ? '<p class="receipt-phone">' + esc(shop.phone_number) + '</p>'
        : '';
      sheet.innerHTML =
        '<div class="text-center mb-3">' +
          logoHtml +
          '<div class="receipt-shop">' + esc(cafeName) + '</div>' +
        '</div>' +
        '<div class="receipt-meta mb-3">' +
          '<div><strong>Order #' + o.id + '</strong></div>' +
          '<div>' + fmtBh(o.created_at) + '</div>' +
          '<div>Cashier: ' + esc(o.staff_username || '—') + '</div>' +
          '<div>Payment: ' + esc(payLabel(o.payment_method)) + '</div>' +
          (o.customer_name ? '<div>Customer: ' + esc(o.customer_name) + '</div>' : '') +
        '</div>' +
        '<table class="receipt-table">' +
          '<thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-end">Amount</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        '<div class="d-flex justify-content-between align-items-baseline mt-3 receipt-total">' +
          '<span>Total</span><span>' + PodCafe.currency(o.total_amount) + '</span>' +
        '</div>' +
        qrHtml +
        phoneHtml +
        (o.notes ? '<p class="receipt-meta mt-3 mb-0">Notes: ' + esc(o.notes) + '</p>' : '') +
        '<p class="text-center receipt-meta mt-3 mb-0">Thank you</p>';
    })();
  })();
  </script>
</body>
</html>
